name: Background removal tests

on:
  pull_request:
    paths:
      - "pyUltroid/**"
      - "plugins/utilities.py"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/remove-background-tests.yml"
  push:
    paths:
      - "pyUltroid/**"
      - "plugins/utilities.py"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/remove-background-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: pip install -r requirements.txt Pillow
      - run: python -m unittest discover -s tests -v
