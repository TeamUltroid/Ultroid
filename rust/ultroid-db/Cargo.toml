[package]
name = "ultroid-db"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
description = "Ultroid's database layer in Rust: the stored value format, the key-value database and the accessors of pyUltroid/dB"

[dependencies]
indexmap = "2.14.2"
num-bigint = "0.5.1"
num-traits = "0.2.19"
serde_json = { version = "1.0.154", features = ["preserve_order", "float_roundtrip"] }
unicode-ident = "1.0.27"
unicode-normalization = "0.1.26"
unicode_names2 = "4.0.0"

[lints.clippy]
all = { level = "warn", priority = -1 }

[lints.rust]
unused_lifetimes = "warn"
trivial_numeric_casts = "warn"
