[package]
name = "ultroid-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
description = "Ultroid's start-up logic in Rust: what a session string is, how a command is recognised, which clients to start"

[dependencies]
base64 = "0.22"

[lints.clippy]
all = { level = "warn", priority = -1 }

[lints.rust]
unused_lifetimes = "warn"
trivial_numeric_casts = "warn"
