# Help Menus

cmda: "✘ Mevcut Komutlar"
help_admintools: "-\n\n• `.promote <yanıt/userid/username>`\n• `.demote`\n    Sohbette kullanıcıyı Yönetici yap / Yöneticiliğini al.\n\n• `.ban <yanıt/userid/username> <sebep>`\n• `.unban`\n    Kullanıcıyı sohbette yasakla / yasağını kaldır.\n\n• `.kick <yanıt/userid/username> <sebep>`\n    Kullanıcıyı sohbetten at.\n\n• `.pin <mesaja yanıt>`\n    Mesajı sohbette sabitle\n• `.tpin <süre> <geçici sabitleme mesajı>`\n• `.unpin (all) <mesaja yanıt>`\n    Sohbetteki mesajların sabitlemesini kaldır.\n\n• `.pinned`\n   Mevcut sohbette sabitlenmiş mesajı al.\n• `.listpinned`\n   Mevcut sohbetteki tüm sabitlenmiş mesajları al\n\n• `.autodelete <24h/7d/1m/off>`\n   Sohbette Otomatik Mesaj Silmeyi Etkinleştir.\n\n• `.purge <mesaja yanıt>`\n    Yanıtlanan mesajdan itibaren tüm mesajları temizle.\n\n• `.purgeme <mesaja yanıt>`\n    Yanıtlanan mesajdan itibaren Sadece kendi mesajlarını temizle.\n\n• `.purgeall`\n    Yanıtlanan kullanıcının tüm mesajlarını sil.\n"
help_afk: " -\n\n• `{i}afk <isteğe bağlı sebep>`\n    AFK, klavye başında değil anlamına gelir,\n    Etkinleştirildikten sonra birisi sizi etiketlerse veya mesaj atarsa bot otomatik yanıt verir.\n\n    (Not: Herhangi bir medyaya `{i}afk <sebep>` ile yanıt vererek AFK mesajına medya ekleyebilirsiniz).\n\n"
help_antiflood: " -\n\n• `{i}setflood <tam sayı>`\n    Sohbette flood sınırını ayarla.\n\n• `{i}remflood`\n    Sohbetten flood sınırını kaldır.\n\n• `{i}getflood`\n    Sohbetin flood sınırını gör.\n"
help_asstcmd: " -\n\n•`{i}addcmd <yeni komut> <yanıt>`\n   Asistan botunuz için o yanıt mesajıyla yeni bir komut ayarlar.\n\n•`{i}remcmd <komut adı>`\n   Komutunuzu kaldırır.\n\n•`{i}listcmd`\n   Tüm özel komutlarınızın listesini alır.\n"
help_audiotools: "✘ Mevcut Komutlar - \n`.makevoice <ses dosyasına yanıt>`\n   Sesten bir sesli mesaj (voice note) oluşturur.\n\n`.atrim <başlangıç> - <bitiş>`\n   Sesi verilen süreye göre kırpar.\n   Süre saniye cinsinden olmalıdır. `.atrim 50-70`\n\n`.extractaudio <medyaya yanıt>`\n   Medyadan sesi çıkarır.\n\n"
help_autoban: "\n\n• `{i}autokick <on/off>`\n    on - Etkinleştirmek için.\n    off - Devre dışı bırakmak için.\n    Gruba yeni katılan kullanıcıları otomatik olarak atar.\n"
help_beautify: " -\n\n• `{i}carbon <metin/mesaja yanıt/belgeye yanıt>`\n    Metni varsayılan ayarlarla carbon görseline dönüştürür.\n\n• `{i}rcarbon <metin/mesaja yanıt/belgeye yanıt>`\n    Metni rastgele arka plan renkleriyle carbon yapar.\n\n• `{i}ccarbon <renk><metin/mesaja yanıt/belgeye yanıt>`\n    Metni özel arka plan rengiyle carbon yapar.\n\n• `{i}rayso <tema-seçenek> <metin>/<mesaja yanıt>`\n  `{i}rayso list` - `Tema listesini al.`\n"
help_blacklist: " -\n\n• `{i}blacklist <kelime/boşlukla ayrılmış kelimeler>`\n    Seçilen kelimeleri bu sohbette kara listeye alır.\n\n• `{i}remblacklist <kelime>`\n    Kelimeyi kara listeden çıkarır..\n\n• `{i}listblacklist`\n    Tüm kara listedeki kelimeleri listeler.\n\n  'Bir kişi kara listedeki bir kelimeyi kullanırsa mesajı silinir'\n  'Ve bu sohbette Yönetici olmalısınız'\n"
help_bot: "\n\n• `{i}alive` | `{i}alive inline`\n    Botunuzun çalışıp çalışmadığını kontrol edin.\n\n• `{i}ping`\n    Ultroid'in yanıt süresini kontrol edin.\n\n• `{i}update`\n    Güncelleme olup olmadığını ve değişiklik günlüklerini görün.\n\n• `{i}cmds`\n    Tüm eklenti isimlerini görüntüleyin.\n\n• `{i}restart`\n    Botunuzu yeniden başlatın.\n\n• `{i}logs (sys)`\n    Tam terminal günlüklerini alın.\n• `{i}logs carbon`\n    Carbon biçiminde sistem günlüklerini alın.\n• `{i}logs heroku`\n   Heroku günlüklerinin son 100 satırını alın.\n\n• `{i}shutdown`\n    Botunuzu kapatın.\n"
help_broadcast: "\n\n• `{i}addch <id/listeye yanıt/hiçbiri>`\n    Sohbeti veritabanına ekler. ID belirtilmezse mevcut sohbeti ekler.\n\n• `{i}remch <all/id/hiçbiri>`\n    Belirtilen sohbeti (hiçbiri seçilirse mevcut sohbeti) veya tüm sohbetleri kaldırır.\n\n• `{i}broadcast <mesaja yanıt>`\n    Yanıtlanan mesajı veritabanındaki tüm sohbetlere gönderir.\n\n• `{i}forward <mesaja yanıt>`\n     Mesajı veritabanındaki tüm sohbetlere iletir.\n\n• `{i}listchannels`\n    Eklenen tüm sohbetlerin listesini alır.\n"
help_button: " -\n\n• `{i}button <buton biçiminde metin>`\n   Buton oluşturur, görsele de yanıt verebilirsiniz\n\nBiçim:- `{i}button Merhaba! @UseUltroid 😎.\n[Ultroid | t.me/theUltroid][Destek | t.me/UltroidSupportChat | same]\n[TeamUltroid | t.me/TeamUltroid]`\n"
help_calculator: " -\n\n•`{i}calc` - Satır İçi (Inline) Hesap Makinesi\n\n"
help_channelhacks: "\n\n🔹 `{i}shift <kaynak kanal> | <hedef kanal>`\n     Tüm eski gönderileri A kanalından B kanalına aktarır.\n      (kanalın kullanıcı adını veya ID'sini kullanabilirsiniz)\n      örnek : `{i}shift @abc | @xyz`\n      [not - bu (' | ') işareti zorunludur]\n\n🔹 Herhangi bir kaynak kanaldan hedef kanala yeni mesajları otomatik paylaşma/iletme için.\n\n   `{i}asource <kanal kullanıcı adı veya id>`\n      Kaynak kanalı veritabanına ekler\n   `{i}dsource <kanal kullanıcı adı veya id>`\n      Kaynak kanalları veritabanından kaldırır\n   `{i}listsource <kanal kullanıcı adı veya id>`\n      Kaynak kanalların listesini gösterir\n\n\n   `{i}adest <kanal kullanıcı adı veya id>`\n      Kanallarınızı veritabanına ekler\n   `{i}ddest <kanal kullanıcı adı veya id>`\n      Kanallarınızı veritabanından kaldırır\n   `{i}listdest <kanal kullanıcı adı veya id>`\n      Kanallarınızın listesini gösterir\n\n   'Veritabanına birçok kanal ekleyebilirsiniz'\n   'Otomatik paylaşımı etkinleştirmek için `{i}setdb AUTOPOST True` kullanın'\n"
help_chatbot: " -\n\n• `{i}addai <kullanıcıya yanıt/kullanıcı adı/userid>`\n   O kullanıcıya yanıt vermesi için AI ChatBot ekler.\n\n• `{i}remai <kullanıcıya yanıt/kullanıcı adı/userid>`\n   AI ChatBot'u kaldırır.\n\n• `{i}repai <kullanıcıya yanıt/mesaj verin>`\n   Yapay zeka ile kullanıcıya yanıt verir.\n\n• `{i}listai`\n   Şu anda AI eklenmiş kullanıcıları listeler.\n"
help_chats: " -\n\n• `{i}delchat <isteğe bağlı- kullanıcı adı/id>`\n    Bu komutun kullanıldığı grubu siler.\n\n• `{i}getlink`\n• `{i}getlink r` - `yönetici onayı ile bağlantı oluştur`\n• `{i}getlink r başlık_buraya` - `bağlantı başlığı ile yönetici onayı`\n• `{i}getlink 10` - `yeni bağlantıda kullanım sınırı`\n    Bu komutun kullanıldığı grubun bağlantısını alır.\n\n• `{i}create (g|b|c) <grup_adı> ; <isteğe bağlı-kullanıcı adı>`\n    Belirli bir isimle grup oluşturur.\n    g - megagrup/süpergrup\n    b - küçük grup\n    c - kanal\n\n• `{i}setgpic <Fotoğrafa yanıt><sohbet kullanıcı adı>`\n    Grubun Profil Fotoğrafını Ayarlar.\n\n• `{i}delgpic <sohbet kullanıcı adı -isteğe bağlı>`\n    Grubun Profil Fotoğrafını Siler.\n\n• `{i}unbanall`\n    Grubun tüm Üyelerinin Yasağını Kaldırır.\n\n• `{i}rmusers`\n    Kullanıcıları özel olarak temizler.\n"
help_cleanaction: " -\n\n•`{i}addclean`\n    Eklenen sohbette katıldı/ayrıldı/sabitledi gibi yaklaşan tüm servis mesajlarını temizler.\n\n•`{i}remclean`\n    Sohbeti veritabanından kaldırır.\n\n•`{i}listclean`\n   Etkinleştirildiği tüm sohbetlerin listesini alır.\n\n"
help_converter: " -\n\n• `{i}convert <gif/img/sticker/webm>`\n    Medyayı gif / resim / webm / normal çıkartmaya dönüştürmek için yanıt verin.\n\n• `{i}doc <dosya_adı.uzantı>`\n    Bir metin mesajını dosyaya kaydetmek için yanıt verin.\n\n• `{i}open`\n    Metnini ortaya çıkarmak için bir dosyaya yanıt verin.\n\n• `{i}rename <uzantısıyla dosya adı>`\n    Dosyayı yeniden adlandırın\n\n• `{i}thumbnail <görsele/küçük resim dosyasına yanıt>`\n    Dosyanızı özel küçük resminizle yükleyin.\n"
help_core: " -\n\n• `{i}install <eklentiye yanıt>`\n    Eklentiyi yüklemek için,\n  `{i}install f`\n    Zorla Yüklemek için.\n\n• `{i}uninstall <eklenti adı>`\n    Eklentiyi devre dışı bırakıp kaldırmak için.\n\n• `{i}load <eklenti adı>`\n    Devre dışı bırakılmış resmi olmayan eklentiyi yüklemek için.\n\n• `{i}unload <eklenti adı>`\n    Resmi olmayan eklentiyi devre dışı bırakmak için.\n\n• `{i}help <eklenti adı>`\n    Her eklenti için size bir yardım menüsü gösterir (bünün gibi).\n\n• `{i}getaddons <koda ham bağlantı>`\n    Verilen ham bağlantıdan eklentileri yükleyin.\n"
help_database: " -\n\n• **Veritabanı Komutları, ne olduğunu bilmiyorsanız kullanmayın.**\n\n• `{i}setdb anahtar | değer`\n    Veritabanında Değer Ayarlayın.\n    örn :\n    `{i}setdb merhaba orada`\n    `{i}setdb merhaba orada | ultroid burada`\n    Mevcut veritabanı değerlerine ekleme yapmak için `{i}setdb --extend değişken değer` veya `{i}setdb -e değişken değer` kullanın.\n\n• `{i}deldb anahtar`\n    Anahtarı Veritabanından Silin.\n\n• `{i}rendb eski anahtar | yeni anahtar`\n    Anahtar Adını Güncelleyin\n"
help_devtools: " -\n\n• `{i}bash <komutlar>`\n• `{i}bash -c <komutlar>` Çıktıyı Carbon görseli olarak alır.\n    Telegram üzerinde linux komutları çalıştırın.\n\n• `{i}eval <code>`\n    Telegram üzerinde python kodları çalıştırın.\n    Kısayollar:\n        client = bot = event.client\n        e = event\n        p = print\n        reply = await event.get_reply_message()\n        chat = event.chat_id\n\n• `{i}cpp <code>`\n    Telegram'dan C++ kodu çalıştırın.\n\n• `{i}sysinfo`\n    Sistem Bilgisini Gösterir.\n"
help_downloadupload: " -\n\n• `{i}ul <dosya/yolu>`\n    Telegram'a dosya yükleyin.\n    İhtiyaca göre dosya adından önce veya sonra şu argümanları kullanın:\n      `--stream` akış olarak yüklemek için.\n      `--delete` yükledikten sonra dosyayı silmek için.\n      `--no-thumb` küçük resim olmadan yüklemek için.\n\n• `{i}dl <dosya adı(isteğe bağlı)>`\n    İndirmek için dosyaya yanıt verin.\n\n• `{i}download <DDL> (| dosya adı)`\n    DDL kullanarak indirin. Verilmezse dosya adı otomatik oluşturulur.\n"
help_echo: "\n\n•`{i}addecho <herhangi birine yanıt>`\n   Yanıtlanan kullanıcının mesajlarını Otomatik Yankılamayı (Echo) başlatır.\n\n•`{i}remecho <herhangi birine yanıt>`\n   Kapatır\n\n•`{i}listecho <herhangi birine yanıt>`\n   Listeyi almak için.\n"
help_extra: " -\n\n• `{i}del <mesaja yanıt>`\n    Yanıtlanan mesajı siler.\n\n• `{i}edit <yeni mesaj>`\n    Son mesajınızı veya yanıtlanan mesajı düzenler.\n\n• `{i}copy <mesaja yanıt>`\n    Yanıtlanan mesajı / medyayı kopyalar.\n\n• `{i}reply`\n    Son gönderilen mesajı yanıtlanan kullanıcıya cevap olarak gönderir.\n"
help_fakeaction: " -\n\n• `{i}ftyping <süre/saniye cinsinden>`\n    `Mevcut sohbette Sahte Yazıyor eylemi gösterir.`\n\n• `{i}faudio <süre/saniye cinsinden>`\n    `Mevcut sohbette Sahte Ses Kaydediyor eylemi gösterir.`\n\n• `{i}fvideo <süre/saniye cinsinden>`\n    `Mevcut sohbette Sahte Video Çekiyor eylemi gösterir.`\n\n• `{i}fgame <süre/saniye cinsinden>`\n    `Mevcut sohbette Sahte Oyun Oynuyor eylemi gösterir.`\n\n• `{i}fsticker <süre/saniye cinsinden>`\n    `Mevcut sohbette Sahte Çıkartma Seçiyor eylemi gösterir.`\n\n• `{i}flocation <süre/saniye cinsinden>`\n    `Mevcut sohbette Sahte Konum Gönderiyor eylemi gösterir.`\n\n• `{i}fcontact <süre/saniye cinsinden>`\n    `Mevcut sohbette Sahte Kişi Seçiyor eylemi gösterir.`\n\n• `{i}fround <süre/saniye cinsinden>`\n    `Mevcut sohbette Sahte Görüntülü Mesaj Çekiyor eylemi gösterir.`\n\n• `{i}fphoto <süre/saniye cinsinden>`\n    `Mevcut sohbette Sahte Fotoğraf Gönderiyor eylemi gösterir.`\n\n• `{i}fdocument <süre/saniye cinsinden>`\n    `Mevcut sohbette Sahte Belge Gönderiyor eylemi gösterir.`\n"
help_fedutils: " -\n\n• `{i}superfban <kullanıcıya yanıt/userid/username>`\n    Yönetici olduğunuz tüm federasyonlarda kişiyi FBan atar.\n\n• `{i}superunfban <kullanıcıya yanıt/userid/username>`\n    Yönetici olduğunuz tüm federasyonlarda kişinin FBan yasağını kaldırır.\n\nAsistanda FBan Grubunu ve hariç tutulacak Fed'leri belirtin.\n\n• `{i}fstat <kullanıcı adı/id/kullanıcıya yanıt>`\n    Rose botundaki kişinin fed durumunu toplar.\n\n• `{i}fedinfo <(fedid)>`\n    Verilen fed ID'sinin veya sahibi olduğunuz fed'in bilgilerini Rose'dan toplar.\n"
help_fileshare: " -\n\n• `{i}store <mesaja_yanıt>`\n   Yanıtlanan mesajı/medyayı depolar ve asistan botunuz aracılığıyla erişilmek üzere paylaşılabilir bir bağlantı oluşturur!\n\n• `{i}delstored <saklanan dosyanın bağlantısı>`\n    Depolanan dosyayı siler.\n\n• `{i}liststored`\n   Depolanan tüm mesajları alır.\n\n• Depolanan dosyaları satır içinde görmek için asistan botunuzla `filestore` araması yapın.\n"
help_filter: " -\n\n• `{i}addfilter <kelime><mesaja yanıt>`\n    Kullanılan kelimeyi yanıtlanan mesajla ilişkili filtre olarak ekler.\n\n• `{i}remfilter <kelime>`\n    Filtreyi kaldırır..\n\n• `{i}listfilter`\n    Tüm filtreleri listeler.\n"
help_fontgen: "\n• `{i}font <yazı tipi adı> : <metin>`\n    Metin için farklı yazı tipleri oluşturur.\n\n• `{i}font`\n    Yazı tiplerinin listesini almak için\n"
help_giftools: "\n\n•`{i}invertgif`\n  Gif'i Tersine Çevirir (negatif yapar).\n\n•`{i}bwgif`\n  Gif'i siyah beyaz yapar\n\n•`{i}rvgif`\n  Gif'i geriye doğru oynatır\n\n•`{i}vtog`\n  Videoya Yanıt Verin, Gif Oluşturacaktır\n  Videodan Gif'e\n\n•`{i}gif <sorgu>`\n   Sorguyla ilgili video/gif gönderir.\n"
help_globaltools: " -\n\n• `{i}gban <kullanıcıya yanıt/ kullanıcı adı>`\n• `{i}ungban`\n    Küresel Olarak Yasakla/Yasağı Kaldır.\n\n• `{i}gstat <kullanıcıya yanıt/userid/username>`\n   Kullanıcının GBanned olup olmadığını kontrol edin.\n\n• `{i}listgban` : Tüm GBanned kullanıcılarını listeler.\n\n• `{i}gmute` | `{i}ungmute` <kullanıcıya yanıt/ kullanıcı adı>\n    Küresel Olarak Sustur/Susturmayı Kaldır.\n\n• `{i}gkick <yanıt/kullanıcı adı>` `Kullanıcıyı Küresel Olarak At`\n• `{i}gcast <metin/yanıt>` `Tüm gruplarda Küresel Olarak mesaj gönder`\n\n• `{i}gadmincast <metin/yanıt>` `Yönetici olduğunuz sohbetlerde Küresel yayın yapın`\n• `{i}gucast <metin/yanıt>` `Tüm özel mesaj kullanıcılarına Küresel mesaj gönderin`\n\n• `{i}gblacklist <sohbet id/kullanıcı adı/hiçbiri (mevcut sohbet için)`\n   Sohbeti kara listeye ekler ve küresel yayınları yok sayar.\n• `{i}ungblacklist` `Sohbeti kara listeden çıkarır.`\n\n• `{i}gpromote <kullanıcıya yanıt> <channel/group/all> <unvan>`\n    Yönetici olduğunuz yerlerde kullanıcıyı küresel olarak terfi ettirir\n    - Yalnızca gruplarda/kanallarda/hepsinde terfi ettirilip ettirilmeyeceğini ayarlayın.\n    Örn- `gpromote group patron` ~ kullanıcıyı tüm gruplarda terfi ettirir.\n        `gpromote @username all sar` ~ kullanıcıyı tüm grup ve kanallarda terfi ettirir\n• `{i}gdemote` - `kullanıcının rütbesini küresel olarak indirir`\n"
help_greetings: " -\n\n---- Karşılamalar ----\n• `{i}setwelcome <mesaj/mesaja yanıt>`\n    Mevcut sohbette karşılama mesajını ayarlar.\n\n• `{i}clearwelcome`\n    Mevcut sohbetteki karşılamayı siler.\n\n• `{i}getwelcome`\n    Mevcut sohbetteki karşılama mesajını alır.\n\n---- Uğurlamalar ----\n• `{i}setgoodbye <mesaj/mesaja yanıt>`\n    Mevcut sohbette uğurlama mesajını ayarlar.\n\n• `{i}cleargoodbye`\n    Mevcut sohbetteki uğurlamayı siler.\n\n• `{i}getgoodbye`\n    Mevcut sohbetteki uğurlama mesajını alır.\n\n• `{i}thankmembers on/off`\n    Gruplarınızda üye sayısı 100*x değerine ulaştığında teşekkür çıkartması gönderir.\n"
help_imagetools: " -\n\n• `{i}border <fotoğrafa/çıkartmaya yanıt>`\n    O medyanın etrafında çerçeve oluşturur..\n    Örn - `{i}border 12,22,23`\n       - `{i}border 12,22,23 ; genişlik (sayı olarak)`\n\n• `{i}grey <herhangi bir medyaya yanıt>`\n    Siyah beyaz yapar.\n\n• `{i}color <herhangi bir Siyah Beyaz medyaya yanıt>`\n    Renkli yapar.\n\n• `{i}toon <herhangi bir medyaya yanıt>`\n    Çizgi film efekti verir.\n\n• `{i}danger <herhangi bir medyaya yanıt>`\n    Tehlikeli görünüm verir.\n\n• `{i}negative <herhangi bir medyaya yanıt>`\n    Negatif görsel oluşturur.\n\n• `{i}blur <herhangi bir medyaya yanıt>`\n    Bulanıklaştırır.\n\n• `{i}quad <herhangi bir medyaya yanıt>`\n    Girdap efekti oluşturur.\n\n• `{i}mirror <herhangi bir medyaya yanıt>`\n    Ayna resmi oluşturur.\n\n• `{i}flip <herhangi bir medyaya yanıt>`\n    Ters çevirir.\n\n• `{i}sketch <herhangi bir medyaya yanıt>`\n    Karakalem çizimini yapar.\n\n• `{i}blue <herhangi bir medyaya yanıt>`\n    Mavi tonlama ekler.\n\n• `{i}csample <renk adı / renk kodu>`\n   örnek : `{i}csample red`\n             `{i}csample #ffffff`\n\n• `{i}pixelator <görsele yanıt>`\n    Piksellenmiş Görsel Oluşturur..\n"
help_instagram: " -\n\n• `{i}instadl <Instagram Bağlantısı>`\n  `Instagram Medyası İndir...`\n\n• `{i}instadata <kullanıcı adı>`\n  `Kendinizin veya başkasının Instagram Verilerini Alın`\n\n• `{i}instaul <videoya/fotoğrafa yanıt> <açıklama>`\n  `Instagram'a Medya Yükle...`\n\n• `{i}igtv <videoya yanıt> <açıklama>`\n  `Igtv'ye Medya Yükle...`\n\n• `{i}reels <videoya yanıt> <açıklama>`\n  `Instagram Reels'e Medya Yükle...`\n\n• Ana sayfa gönderilerini almak için Asistanınızda\n   `instatm` sorgusu ile Satır İçi (Inline) moda geçin...\n\n• Kullanmadan önce `INSTA_USERNAME` ve `INSTA_PASSWORD`\n  değişkenlerini doldurun..\n"
help_locks: " -\n\n• `{i}lock <msgs/media/sticker/gif/games/inline/polls/invites/pin/changeinfo>`\n    Kullanılan Gruba Belirtilen Ayarı Kilitler.\n\n• `{i}unlock <msgs/media/sticker/gif/games/inline/polls/invites/pin/changeinfo>`\n    Kullanılan Grupta Belirtilen Ayarın KİLİDİNİ AÇAR.\n"
help_logo: " -\n\n• `{i}logo <metin>`\n   Verilen Metinden bir logo oluşturur\n   Veya üzerine metin yazmak için Görsele Yanıt Verin.\n   Veya o yazı tipiyle yazmak için Yazı Tipi Dosyasına Yanıt Verin.\n\n"
help_mediatools: " -\n\n• `{i}mediainfo <medyaya yanıt>`\n   Medya hakkında bilgi alır.\n\n• `{i}rotate <derece/açı> <medyaya yanıt>`\n   Herhangi bir videoyu/fotoğrafı/medyayı döndürür..\n   Not: video için 90'ın katları şeklinde açı olmalıdır\n"
help_misc: " -\n\n• `{i}eod`\n    `Günün Olaylarını Alın`\n\n• `{i}pntrst <bağlantı/id>`\n    Pinterest pinlerini indirin ve gönderin\n\n• `{i}gadget <arama sorgusu>`\n    Telegram'dan Teknoloji/Cihaz Araması yapın.\n\n• `{i}randomuser`\n   Rastgele bir kullanıcı hakkında detaylar oluşturun.\n\n• `{i}ascii <görsele yanıt>`\n    Yanıtlanan görseli HTML'e dönüştürün.\n"
help_mute: " -\n\n• `{i}mute <mesaja yanıt/ kullanıcı id>`\n    Mevcut sohbette kullanıcıyı susturur.\n\n• `{i}unmute <mesaja yanıt/ kullanıcı id>`\n    Mevcut sohbette kullanıcının susturmasını kaldırır.\n\n• `{i}dmute <mesaja yanıt/ kullanıcı id>`\n    Mevcut sohbette mesajlarını silerek kullanıcıyı susturur.\n\n• `{i}undmute <mesaja yanıt/ kullanıcı id>`\n    Mevcut sohbette dmute yapılmış kullanıcının susturmasını kaldırır.\n\n• `{i}tmute <süre> <mesaja yanıt/ kullanıcı id>`\n    s- saniye\n    m- dakika\n    h- saat\n    d- gün\n    Mevcut sohbette kullanıcıyı süreli olarak susturur.\n"
help_notes: " -\n\n• `{i}addnote <kelime><mesaja yanıt>`\n    Yanıtlanan mesaj ve seçilen kelime ile sohbet içinde not ekler.\n\n• `{i}remnote <kelime>`\n    Notu sohbetten kaldırır.\n\n• `{i}listnote`\n    Tüm notları listeler.\n\n• Kullanım:\n   Herkesin kullanabilmesi için grupta notları ayarlayın.\n   Notu almak için `#(Notun Anahtar Kelimesi)` yazın\n"
help_other: " -\n\n• `{i}send <kullanıcı adı/id> <yanıt/yazı>`\n    Kullanıcıya/Sohbete mesaj gönderir.\n\n• `{i}fwdreply <mesaja yanıt>`\n    Birinin mesajına özelde ileterek yanıt verin.\n\n• `{i}save <mesaja yanıt>`\n    Yanıtlanan mesajı Kaydedilen Mesajlar kutunuza kaydeder.\n\n• `{i}fsave <mesaja yanıt>`\n    Yanıtlanan mesajı Kaydedilen Mesajlarınıza iletir.\n"
help_pmpermit: " -\n\n• `{i}a` veya `{i}approve`\n    Birinin özelden yazmasını onaylar.\n\n• `{i}da` veya `{i}disapprove`\n    Birinin özelden yazma onayını kaldırır.\n\n• `{i}block`\n    Birini engeller.\n\n• `{i}unblock` | `{i}unblock all`\n    Birinin engelini kaldırır.\n\n• `{i}nologpm`\n    Kullanıcıdan gelen mesajları günlüğe kaydetmeyi durdurur.\n\n• `{i}logpm`\n    Kullanıcıdan gelen mesajları günlüğe kaydetmeye başlar.\n\n• `{i}startarchive`\n    Yeni özel mesajları arşivler.\n\n• `{i}stoparchive`\n    Yeni özel mesajları arşivlemez.\n\n• `{i}cleararchive`\n    Tüm sohbetleri arşivden çıkarır.\n\n• `{i}listapproved`\n   Onaylanmış tüm özel sohbetleri listeler.\n"
help_polls: " -\n\n• `{i}poll <soru> ; <seçenek> ; <seçenek>`\n    Verilen Seçeneklerle Anonim Anket Oluşturur\n\n• `{i}poll <soru> ; <seçenek> ; <seçenek> | <tür>`\n    İstenen türde belirtilen anketi oluşturur!\n    tür `public`, `multiple` veya `quiz` olabilir\n\n• `{i}poll <soru> ; <seçenek> ; <seçenek> | quiz_<doğruno>`\n    Doğruno'nun doğru olan seçeneğin numarası olduğu bilgi yarışması anketi oluşturur\n\n"
help_profanityfilter: " -\n\n•`{i}addprofanity`\n   Biri sohbette kötü kelime gönderirse, bot o mesajı siler.\n\n•`{i}remprofanity`\n   Sohbeti Küfür listesinden çıkarır.\n\n"
help_profile: " -\n\n• `{i}setname <ad // soyad>`\n    Profil adınızı değiştirin.\n\n• `{i}setbio <biyografi>`\n    Profil biyografinizi değiştirin.\n\n• `{i}setpic <fotoğrafa yanıt>`\n    Profil fotoğrafınızı değiştirin.\n\n• `{i}delpfp <n>(isteğe bağlı)`\n    Bir profil fotoğrafını siler, değer verilmezse veya belirtilen n sayıda fotoğrafı siler.\n\n• `{i}poto <kullanıcı adı>`\n    Varsa Sohbetin/Kullanıcının fotoğrafını yükler.\n"
help_qrcode: " -\n\n• `{i}qrcode <metin/metne yanıt>`\n   `Metinden QR kodu oluşturur`\n\n• `{i}addqr <görsele yanıt> <metin>`\n   `Metnin QR kodunu oluşturur ve görsele ekler.`\n\n• `{i}qrdecode <qr koduna yanıt>`\n   `QR kodunu çözer.`\n"
help_resize: " -\n\n•`{i}size <medyaya yanıt>`\n   Boyutunu alır.\n\n•`{i}resize <genişlik> <yükseklik>`\n   Görseli x, y ekseninde yeniden boyutlandırır.\n   örn. `{i}resize 690 960`\n"
help_schedulemsg: " -\n\n•`{i}schedule <metin/mesaja yanıt> <süre>`\n    Süre kısmında sayı olarak saniye veya 1h, 1m gibi kullanabilirsiniz\n    örn. `{i}schedule Merhaba 100` 100 saniye sonra mesajı iletir.\n    örn. `{i}schedule Merhaba 1h` Bir saat sonra mesajı iletir.\n"
help_search: " -\n\n• `{i}saavn <arama sorgusu>`\n    Saavn'dan şarkı indirin.\n\n• `{i}google <sorgu>`\n    Google araması yapmak için.\n\n• `{i}github <kullanıcı adı>`\n    Kullanıcının github profilinin tüm bilgilerini alın.\n\n• `{i}img <sorgu>`\n  `{i}img <sorgu> ; <sonuç sayısı>`\n    Görsel araması yapmak için.\n\n• `{i}reverse`\n    Kaynağını bulmak için bir Görsele veya çıkartmaya yanıt verin.\n"
help_snips: " -\n\n• `{i}addsnip <kelime><mesaja yanıt>`\n    Yanıtlanan mesajla ilişkili olarak kullanılan kelimeyi snip olarak ekler.\n\n• `{i}remsnip <kelime>`\n    Snip kelimesini kaldırır..\n\n• `{i}listsnip`\n    Tüm snip'leri listeler.\n\n• Kullanım:\n    Ayarlanan yanıtı almak için `$(snip kelimeniz)` yazın.\n"
help_specialtools: " -\n\n• `{i}wspr <kullanıcı adı>`\n    Gizli mesaj gönderir..\n\n• `{i}q <renk-isteğe bağlı>`\n• `{i}q @kullanıcıadı`\n• `{i}q r <renk-isteğe bağlı>`\n• `{i}q count` : `çoklu alıntılar`\n    Alıntı (Quote) görseli oluşturur..\n\n• `{i}sticker <sorgu>`\n    İsteğinize göre Çıkartma Arayın..\n\n• `{i}getaudio <ses dosyasına yanıt>`\n    İstediğiniz Video/Gif'e koymak için Sesi İndirin.\n\n• `{i}addaudio <Videoya/gif'e yanıt>`\n    Yukarıdaki sesi yanıtlanan video/gif'e ekler.\n\n• `{i}dob <doğum tarihi>`\n    Yalnızca gg/aa/yy Biçiminde Girin (örn .dob 01/01/1999).\n\n• `{i}wall <sorgu>`\n    İsteğinize göre HD Duvar Kağıdı Arayın..\n"
help_stickertools: " -\n\n• `{i}destroy <hareketli çıkartmaya yanıt>`\n    Çıkartmayı yok etmek/bozmak için.\n\n• `{i}tiny <medyaya yanıt>`\n    Küçük (Tiny) çıkartmalar oluşturmak için.\n\n• `{i}kang <görsele/çıkartmaya yanıt>`\n    Çıkartmayı çal (kendi paketine ekle).\n\n• `{i}packkang <paket adı>`\n    Tüm çıkartma setini çal (özel isimle).\n\n• `{i}round <herhangi bir medyaya yanıt>`\n    Yuvarlak çıkartma çıkarmak için.\n"
help_sudo: " -\n\n• `{i}addsudo`\n    Kullanıcıya yanıt vererek veya <boşluk> ile ayrılmış userid(ler) kullanarak Sudo Kullanıcıları Ekleyin\n\n• `{i}delsudo`\n    Kullanıcıya yanıt vererek veya <boşluk> ile ayrılmış userid(ler) kullanarak Sudo Kullanıcılarını Kaldırın\n\n• `{i}listsudo`\n    Tüm sudo kullanıcılarını listeleyin.\n"
help_tag: " -\n\n• `{i}tagall`\n    Sohbetin İlk 100 Üyesini Etiketleyin.\n\n• `{i}tagadmins`\n    O sohbetin Yöneticilerini Etiketleyin.\n\n• `{i}tagowner`\n    O sohbetin Sahibini Etiketleyin\n\n• `{i}tagbots`\n    O sohbetin Botlarını Etiketleyin.\n\n• `{i}tagrec`\n    Son Zamanlarda Aktif Olan Üyeleri Etiketleyin.\n\n• `{i}tagon`\n    Çevrimiçi Üyeleri Etiketleyin (yalnızca gizlilik kapalıysa çalışır).\n\n• `{i}tagoff`\n    Çevrimdışı Üyeleri Etiketleyin (yalnızca gizlilik kapalıysa çalışır).\n"
help_tools: " -\n\n• `{i}circle`\n    Video notu almak için bir ses şarkısına veya gif'e yanıt verin.\n\n• `{i}ls`\n    Bir Dizin İçindeki tüm Dosyaları Alın.\n\n• `{i}bots`\n    Kalıcı bağlantılarıyla birlikte mevcut sohbetteki bot sayısını gösterir.\n\n• `{i}hl <bağlantı> <metin-isteğe bağlı>`\n    Bağlantıyı mesaj olarak bir boşluk karakterine gömer.\n\n• `{i}id`\n    ID'sini Almak İçin Bir Çıkartmaya Yanıt Verin\n    ID'sini Almak İçin Bir Kullanıcıya Yanıt Verin\n    Yanıt Vermeden Sohbetin ID'sini Alırsınız\n\n• `{i}sg <kullanıcıya yanıt><kullanıcı adı/id>`\n    Yanıtlanan kullanıcının İsim Geçmişini Alın.\n\n• `{i}tr <hedef dil kodu> <(mesaja) yanıt>`\n    Çevrilmiş mesajı alın.\n\n• `{i}webshot <url>`\n    Web sayfasının ekran görüntüsünü alın.\n\n• `{i}shorturl <url> <id-isteğe bağlı>`\n    Herhangi bir url'yi kısaltın...\n"
help_unsplash: " -\n\n• {i}unsplash <arama sorgusu> ; <resim sayısı>\n    Unsplash Görsel Araması.\n"
help_usage: "\n\n• `{i}usage`\n    Genel kullanımı alın.\n\n• `{i}usage heroku`\n   Heroku istatistiklerini alın.\n\n• `{i}usage db`\n   Veritabanı depolama kullanımını alın.\n"
help_utilities: " -\n\n• `{i}kickme` : Gruptan ayrılır.\n\n• `{i}date` : Takvimi Gösterir.\n\n• `{i}listreserved`\n    Sahip olduğunuz tüm kullanıcı adlarını (kanallar/gruplar) listeler.\n\n• `{i}stats` : Profil istatistiklerinizi görün.\n\n• `{i}paste` - `Uzun metin ekleyin / Metin dosyasına yanıt verin.`\n\n• `{i}info <kullanıcı adı/userid/chatid>`\n    Birinin mesajına yanıt verin.\n\n• `{i}invite <kullanıcı adı/userid>`\n    Sohbete kullanıcı ekleyin.\n\n• `{i}rmbg <fotoğrafa yanıt>`\n    O fotoğraftan arka planı kaldırın.\n\n• `{i}telegraph <medyaya/metne yanıt>`\n    Medya/metni telegraph'a yükleyin.\n\n• `{i}json <mesaja yanıt>`\n    Mesajın json kodlamasını alın.\n\n• `{i}suggest <mesaja yanıt> veya <anket başlığı>`\n    Yanıtlanan öneri için Evet/Hayır anketi oluşturun.\n\n• `{i}ipinfo <ipAdresi>` : O IP adresi hakkında bilgi alın.\n\n• `{i}cpy <mesaja yanıt>`\n   Yanıtlanan mesajı biçimlendirmesiyle kopyalar. 24 saat içinde süresi dolard.\n• `{i}pst`\n   Kopyalanan mesajı biçimlendirmesiyle yapıştırır.\n\n• `{i}thumb <dosyaya yanıt>` : Yanıtlanan dosyanın küçük resmini indirir.\n\n• `{i}getmsg <mesaj bağlantısı>`\n  İletme/kopyalama kısıtlaması olan sohbetlerden mesajları alın.\n"
help_variables: " -\n\n• `{i}get var <değişken adı>`\n   Verilen değişken adının değerini alın.\n\n• `{i}get type <değişken adı>`\n   Değişken türünü alın.\n\n• `{i}get db <anahtar>`\n   Verilen anahtarın veritabanı değerini alın.\n\n• `{i}get keys`\n   Tüm redis anahtarlarını alın.\n"
help_vctools: " -\n\n• `{i}startvc`\n    Grupta Sesli Arama Başlatın.\n\n• `{i}stopvc`\n    Grupta Sesli Aramayı Durdurun.\n\n• `{i}vctitle <başlık>`\n    Sesli arama başlığını değiştirin.\n\n• `{i}vcinvite`\n    Gruptaki tüm üyeleri Sesli Aramaya davet edin.\n    (Katılmış olmalısınız)\n"
help_videotools: " -\n\n•`{i}sample <saniye cinsinden süre>`\n   Videodan kısa bir örnek (sample) oluşturur..\n\n• `{i}vshots <kare sayısı>`\n   Videodan ekran görüntüleri oluşturur..\n\n• `{i}vtrim <başlangıç> - <bitiş> saniye cinsinden`\n    Uzun bir videoyu kırpın..\n"
help_warn: "\n\n•`{i}warn <kullanıcıya yanıt> <sebep>`\n    Uyarı Verir.\n\n•`{i}resetwarn <kullanıcıya yanıt>`\n    Tüm Uyarıları Sıfırlamak İçin.\n\n•`{i}warns <kullanıcıya yanıt>`\n   Kullanıcının Uyarı Listesini Almak İçin.\n\n•`{i}setwarn <uyarı sayısı> | <ban/mute/kick>`\n   Uyarılar için uyarı sayısını ayarlayın\n   ' | ' işaretinden sonra ban/mute/kick gibi eylem belirtin\n   Varsayılan olarak 3 atma (kick) olarak ayarlıdır\n   Örnek : `setwarn 5 | mute`\n\n"
help_webupload: " -\n\n• `{i}webupload`\n    Dosyaları başka bir sunucuya yükleyin.\n"
help_words: " -\n\n• `{i}meaning <kelime>`\n    Kelimenin anlamını alın.\n\n• `{i}synonym <kelime>`\n    Tüm eş anlamlıları alın.\n\n• `{i}antonym <kelime>`\n    Tüm zıt anlamlıları alın.\n\n• `{i}ud <kelime>`\n    Urban Dictionary'den kelime tanımını getirin.\n"
help_ziptools: "\n\n• `{i}zip <dosyaya yanıt>`\n    Yanıtlanan dosyayı zipler\n    Zip'e parola koymak için: `{i}zip <parola>` dosyaya yanıt verin\n\n• `{i}unzip <zip dosyasına yanıt>`\n    Yanıtlanan dosyanın zip'ini açar.\n\n• `{i}azip <dosyaya yanıt>`\n   Toplu zip yüklemesi için dosyayı gruba ekler\n\n• `{i}dozip`\n   `{i}azip` ile eklediğiniz dosyaları toplu halde ziplayıp yükler\n   Parola koymak için: `{i}dozip <parola>`\n\n"
