# Help Menus

cmda: "✘ Available Commands 📋"
help_admintools: "-\n\n• `.promote <reply to user/userid/username>`\n• `.demote`\n    Promote/Demote the user in the chat. 🎖️\n\n• `.ban <reply to user/userid/username> <reason>`\n• `.unban`\n    Ban/Unban the user from the chat. 🔨\n\n• `.kick <reply to user/userid/username> <reason>`\n    Kick the user from the chat. 👢\n\n• `.pin <reply to message>`\n    Pin the message in the chat. 📌\n• `.tpin <time> <temp pin message>`\n• `.unpin (all) <reply to message>`\n    Unpin the messages in the chat. 🔓\n\n• `.pinned`\n   Get the pinned message in the current chat. 📍\n• `.listpinned`\n   Get all pinned messages in the current chat. 📋\n\n• `.autodelete <24h/7d/1m/off>`\n   Enable Auto Delete Messages in the chat. ⏳\n\n• `.purge <reply to message>`\n    Purge all messages starting from the replied message. 🧹\n\n• `.purgeme <reply to message>`\n    Purge only your messages starting from the replied message. 🗑️\n\n• `.purgeall`\n    Delete all messages of the replied user. 🚫\n"
help_afk: " -\n\n• `{i}afk <optional reason>`\n    AFK means Away From Keyboard. 🌙\n    After this is activated, if someone tags or messages you, they will receive an automated reply from the bot.\n\n    (Note: Set a media file in AFK messages by replying to any media with `{i}afk <reason>`). 🖼️\n\n"
help_antiflood: " -\n\n• `{i}setflood <integer>`\n    Set a flood limit in a chat. 🚧\n\n• `{i}remflood`\n    Remove the flood limit from a chat. 🔓\n\n• `{i}getflood`\n    Get the current flood limit of a chat. 📊\n"
help_asstcmd: " -\n\n•`{i}addcmd <new cmd> <reply>`\n   Set a new command for your assistant bot with that reply message. ➕\n\n•`{i}remcmd <cmd name>`\n   Remove your custom command. 🗑️\n\n•`{i}listcmd`\n   Get a list of all your custom commands. 📋\n"
help_audiotools: "✘ Available Commands - \n`.makevoice <reply to audio>`\n   Creates a voice note from Audio. 🎙️\n\n`.atrim <from time> - <to time>`\n   Trim audio as per the given time.\n   Time must be in seconds. e.g., `.atrim 50-70` ✂️\n\n`.extractaudio <reply to media>`\n   Extract the audio from it. 🎶\n\n"
help_autoban: "\n\n• `{i}autokick <on/off>`\n    on - To enable.\n    off - To disable.\n    Automatically kick newly joined users from the group. 👢\n"
help_beautify: " -\n\n• `{i}carbon <text/reply to msg/reply to document>`\n    Carbonise the text with default settings. 🎨\n\n• `{i}rcarbon <text/reply to msg/reply to document>`\n    Carbonise the text with random background colors. 🌈\n\n• `{i}ccarbon <color ><text/reply to msg/reply to document>`\n    Carbonise the text with custom background colors. ✨\n\n• `{i}rayso <opt-theme> <text>/<reply to message>`\n  `{i}rayso list` - `Get a list of themes.` 🌟\n"
help_blacklist: " -\n\n• `{i}blacklist <word/all words with a space>`\n    Blacklist the chosen word in that chat. 🚫\n\n• `{i}remblacklist <word>`\n    Remove the word from the blacklist. 🔓\n\n• `{i}listblacklist`\n    List all blacklisted words. 📋\n\n  'If a person uses a blacklisted word, their message will be deleted.'\n  'Note: You must be an Admin in that chat.' 👑\n"
help_bot: "\n\n• `{i}alive` | `{i}alive inline`\n    Check if your bot is working. 🤖\n\n• `{i}ping`\n    Check Ultroid's response time. 🏓\n\n• `{i}update`\n    See changelogs if any update is available. 🔄\n\n• `{i}cmds`\n    View all plugin names. 🧩\n\n• `{i}restart`\n    Restart your bot. 🔁\n\n• `{i}logs (sys)`\n    Get the full terminal logs. 📋\n• `{i}logs carbon`\n    Get the carbonized sys logs. 🎨\n• `{i}logs heroku`\n   Get the latest 100 lines of Heroku logs. ⚙️\n\n• `{i}shutdown`\n    Turn off your bot. 🛑\n"
help_broadcast: "\n\n• `{i}addch <id/reply to list/none>`\n    Add chat to the database. Adds the current chat if no ID is specified. ➕\n\n• `{i}remch <all/id/none>`\n    Removes the specified chat (current chat if none specified), or all chats. 🗑️\n\n• `{i}broadcast <reply to msg>`\n    Send the replied message to all chats in the database. 📢\n\n• `{i}forward <reply to msg>`\n     Forward the message to all chats in the database. ⏩\n\n• `{i}listchannels`\n    Get a list of all added chats. 📋\n"
help_button: " -\n\n• `{i}button <text with button format>`\n   Create a button; you can also reply to a picture. 🔘\n\nFormat:- `{i}button Hey There! @UseUltroid 😎.\n[Ultroid | t.me/theUltroid][Support | t.me/UltroidSupportChat | same]\n[TeamUltroid | t.me/TeamUltroid]`\n"
help_calculator: " -\n\n•`{i}calc` - Inline Calculator 🧮\n\n"
help_channelhacks: "\n\n🔹 `{i}shift <from channel> | <to channel>`\n     This will transfer all old posts from channel A to channel B.\n      (You can use the username or ID of the channel too)\n      Example: `{i}shift @abc | @xyz`\n      [Note - the (' | ') sign is necessary] 🔄\n\n🔹 For auto-posting/forwarding all new messages from any source channel to any destination channel.\n\n   `{i}asource <channel username or id>`\n      This adds the source channel to the database. ➕\n   `{i}dsource <channel username or id>`\n      This removes source channels from the database. 🗑️\n   `{i}listsource <channel username or id>`\n      Show a list of source channels. 📋\n\n\n   `{i}adest <channel username or id>`\n      This adds your destination channels to the database. 🎯\n   `{i}ddest <channel username or id>`\n      This removes your destination channels from the database. 🗑️\n   `{i}listdest <channel username or id>`\n      Show a list of your destination channels. 📋\n\n   'You can set many channels in the database.'\n   'To activate auto-post, use `{i}setdb AUTOPOST True`' ✨\n"
help_chatbot: " -\n\n• `{i}addai <reply to user/give username/userid>`\n   Add an AI ChatBot to reply to that user. 🤖\n\n• `{i}remai <reply to user/give username/userid>`\n   Remove the AI ChatBot. 🗑️\n\n• `{i}repai <reply to user/give a message>`\n   Reply to the user with a message generated by AI. 💬\n\n• `{i}listai`\n   List the currently AI-enabled users. 📋\n"
help_chats: " -\n\n• `{i}delchat <optional- username/id>`\n    Delete the group this command is used in. 🗑️\n\n• `{i}getlink`\n• `{i}getlink r` - `Create a link with admin approval`\n• `{i}getlink r title_here` - `Admin approval with a link title`\n• `{i}getlink 10` - `Set a usage limit for the new link`\n    Get the link of the group this command is used in. 🔗\n\n• `{i}create (g|b|c) <group_name> ; <optional-username>`\n    Create a group with a specific name. ➕\n    g - megagroup/supergroup\n    b - small group\n    c - channel\n\n• `{i}setgpic <reply to Photo><chat username>`\n    Set the Profile Photo of the Group. 🖼️\n\n• `{i}delgpic <chat username -optional>`\n    Delete the Profile Photo of the Group. 🗑️\n\n• `{i}unbanall`\n    Unban all members of a group. 🕊️\n\n• `{i}rmusers`\n    Remove users specifically. 👢\n"
help_cleanaction: " -\n\n•`{i}addclean`\n    Clean all upcoming action messages in the added chat (like someone joined/left/pinned etc.). 🧹\n\n•`{i}remclean`\n    Remove the chat from the database. 🗑️\n\n•`{i}listclean`\n   Get a list of all chats where this is activated. 📋\n\n"
help_converter: " -\n\n• `{i}convert <gif/img/sticker/webm>`\n    Reply to media to convert it into a gif / image / webm / normal sticker. 🔄\n\n• `{i}doc <filename.ext>`\n    Reply to a text message to save it in a file. 📄\n\n• `{i}open`\n    Reply to a file to reveal its text. 📖\n\n• `{i}rename <file name with extension>`\n    Rename the file. ✏️\n\n• `{i}thumbnail <reply to image/thumbnail file>`\n    Upload your file with a custom thumbnail. 🖼️\n"
help_core: " -\n\n• `{i}install <reply to plugin>`\n    To install the plugin. 🚀\n  `{i}install f`\n    To force install.\n\n• `{i}uninstall <plugin name>`\n    To unload and remove the plugin. 🗑️\n\n• `{i}load <plugin name>`\n    To load an unloaded unofficial plugin. 🔄\n\n• `{i}unload <plugin name>`\n    To unload an unofficial plugin. 🛑\n\n• `{i}help <plugin name>`\n    Shows you a help menu (like this) for every plugin. ℹ️\n\n• `{i}getaddons <raw link to code>`\n    Load plugins from the given raw link. 🔗\n"
help_database: " -\n\n• **DataBase Commands, do not use if you don't know what it is.** ⚠️\n\n• `{i}setdb key | value`\n    Set a value in the Database. 💾\n    e.g :\n    `{i}setdb hi there`\n    `{i}setdb hi there | ultroid here`\n    `{i}setdb --extend variable value` or `{i}setdb -e variable value` to add the value to the existing values in db.\n\n• `{i}deldb key`\n    Delete a key from the DB. 🗑️\n\n• `{i}rendb old keyname | new keyname`\n    Update a Key Name. 🔄\n"
help_devtools: " -\n\n• `{i}bash <cmds>`\n• `{i}bash -c <cmds>` Carbon image as command output. 🎨\n    Run Linux commands on Telegram. 🐧\n\n• `{i}eval <code>`\n    Evaluate Python commands on Telegram. 🐍\n    Shortcuts:\n        client = bot = event.client\n        e = event\n        p = print\n        reply = await event.get_reply_message()\n        chat = event.chat_id\n\n• `{i}cpp <code>`\n    Run C++ code from Telegram. 💻\n\n• `{i}sysinfo`\n    Shows System Info. 📊\n"
help_downloadupload: " -\n\n• `{i}ul <path/to/file>`\n    Upload files on Telegram. ⬆️\n    Use the following arguments before or after the filename as per requirement:\n      `--stream` to upload as a stream.\n      `--delete` to delete the file after uploading.\n      `--no-thumb` to upload without a thumbnail.\n\n• `{i}dl <filename(optional)>`\n    Reply to a file to download it. ⬇️\n\n• `{i}download <DDL> (| filename)`\n    Download using DDL. Will autogenerate a filename if not given. 📥\n"
help_echo: "\n\n•`{i}addecho <reply to anyone>`\n   Start Auto Echoing the messages of the replied user. 🗣️\n\n•`{i}remecho <reply to anyone>`\n   Turn it off. 🔇\n\n•`{i}listecho <reply to anyone>`\n   Get the list. 📋\n"
help_extra: " -\n\n• `{i}del <reply to message>`\n    Delete the replied message. 🗑️\n\n• `{i}edit <new message>`\n    Edit your last message or the replied message. ✏️\n\n• `{i}copy <reply to message>`\n    Copy the replied message / media. 📋\n\n• `{i}reply`\n    Reply the last sent message to the replied user. 💬\n"
help_fakeaction: " -\n\n• `{i}ftyping <time/in secs>`\n    `Show Fake Typing action in the current chat. ⌨️`\n\n• `{i}faudio <time/in secs>`\n    `Show Fake Recording action in the current chat. 🎙️`\n\n• `{i}fvideo <time/in secs>`\n    `Show Fake Video action in the current chat. 📹`\n\n• `{i}fgame <time/in secs>`\n    `Show Fake Game Playing action in the current chat. 🎮`\n\n• `{i}fsticker <time/in secs>`\n    `Show Fake Sticker Choosing action in the current chat. 🖼️`\n\n• `{i}flocation <time/in secs>`\n    `Show Fake Location action in the current chat. 📍`\n\n• `{i}fcontact <time/in secs>`\n    `Show Fake Contact Choosing action in the current chat. 👤`\n\n• `{i}fround <time/in secs>`\n    `Show Fake Video Message action in the current chat. 🔄`\n\n• `{i}fphoto <time/in secs>`\n    `Show Fake Sending Photo action in the current chat. 📸`\n\n• `{i}fdocument <time/in secs>`\n    `Show Fake Sending Document action in the current chat. 📁`\n"
help_fedutils: " -\n\n• `{i}superfban <reply to user/userid/username>`\n    FBan the person across all feds in which you are an admin. 🔨\n\n• `{i}superunfban <reply to user/userid/username>`\n    Un-FBan the person across all feds in which you are an admin. 🕊️\n\nSpecify the FBan Group and Feds to exclude in the assistant.\n\n• `{i}fstat <username/id/reply to user>`\n    Collect the fed stat of the person in Rose. 📊\n\n• `{i}fedinfo <(fedid)>`\n    Collect federation info of the given fed ID, or of the fed you own, from Rose. ℹ️\n"
help_fileshare: " -\n\n• `{i}store <reply_to_message>`\n   Store the replied message/media and generate a shareable link to that file, to be accessed via your assistant bot! 🔗\n\n• `{i}delstored <link of stored file>`\n    Delete the stored file. 🗑️\n\n• `{i}liststored`\n   Get all stored messages. 📋\n\n• Go Inline with your assistant bot using `filestore` to see stored files inline. ✨\n"
help_filter: " -\n\n• `{i}addfilter <word><reply to a message>`\n    Add the used word as a filter relating to the replied message. 🎯\n\n• `{i}remfilter <word>`\n    Remove the filtered word. 🗑️\n\n• `{i}listfilter`\n    List all filters. 📋\n"
help_fontgen: "\n• `{i}font <font name> : <text>`\n    Generate different fonts for the text. 🔤\n\n• `{i}font`\n    Get a list of available fonts. 📋\n"
help_giftools: "\n\n•`{i}invertgif`\n  Make the Gif Inverted (negative). 🔄\n\n•`{i}bwgif`\n  Make the Gif black and white. 🖤\n\n•`{i}rvgif`\n  Reverse a Gif. ⏪\n\n•`{i}vtog`\n  Reply to a Video, it will create a Gif.\n  Video to Gif. 🎬\n\n•`{i}gif <query>`\n   Send a video related to the query. 🔍\n"
help_globaltools: " -\n\n• `{i}gban <reply user/ username>`\n• `{i}ungban`\n    Ban/Unban Globally. 🌍🔨\n\n• `{i}gstat <reply to user/userid/username>`\n   Check if a user is GBanned. 🔍\n\n• `{i}listgban` : List all GBanned users. 📋\n\n• `{i}gmute` | `{i}ungmute` <reply user/ username>\n    Mute/UnMute Globally. 🔇\n\n• `{i}gkick <reply/username>` `Globally Kick User` 👢\n• `{i}gcast <text/reply>` `Globally Send msg in all grps` 📢\n\n• `{i}gadmincast <text/reply>` `Globally broadcast in your admin chats` 👑\n• `{i}gucast <text/reply>` `Globally send msg to all pm users` 📩\n\n• `{i}gblacklist <chat id/username/nothing (for current chat)>`\n   Add chat to the blacklist and ignore global broadcasts. 🚫\n• `{i}ungblacklist` `Remove the chat from the blacklist.` 🔓\n\n• `{i}gpromote <reply to user> <channel/group/all> <rank>`\n    Globally promote a user where you are an admin. 🎖️\n    - Set whether to promote only in groups/channels/all.\n    Eg- `gpromote group boss` ~ promotes the user in all groups.\n        `gpromote @username all sar` ~ promotes the user in all groups & channels.\n• `{i}gdemote` - `Demote a user globally` ⬇️\n"
help_greetings: " -\n\n---- Welcomes ----\n• `{i}setwelcome <message/reply to message>`\n    Set a welcome message in the current chat. 🎉\n\n• `{i}clearwelcome`\n    Delete the welcome message in the current chat. 🗑️\n\n• `{i}getwelcome`\n    Get the welcome message in the current chat. 📋\n\n---- GoodByes ----\n• `{i}setgoodbye <message/reply to message>`\n    Set a goodbye message in the current chat. 👋\n\n• `{i}cleargoodbye`\n    Delete the goodbye message in the current chat. 🗑️\n\n• `{i}getgoodbye`\n    Get the goodbye message in the current chat. 📋\n\n• `{i}thankmembers on/off`\n    Send a thank you sticker upon hitting a member count of 100*x in your groups. 🎊\n"
help_imagetools: " -\n\n• `{i}border <reply to photo/sticker>`\n    Create a border around that media. 🖼️\n    Ex - `{i}border 12,22,23`\n       - `{i}border 12,22,23 ; width (in number)`\n\n• `{i}grey <reply to any media>`\n    Make it black and white. 🖤\n\n• `{i}color <reply to any Black and White media>`\n    Make it colorful. 🌈\n\n• `{i}toon <reply to any media>`\n    Give it a toon effect. 🎨\n\n• `{i}danger <reply to any media>`\n    Make it look dangerous. ⚠️\n\n• `{i}negative <reply to any media>`\n    Make a negative image. 🔄\n\n• `{i}blur <reply to any media>`\n    Make it blurry. 🌫️\n\n• `{i}quad <reply to any media>`\n    Create a Vortex. 🌀\n\n• `{i}mirror <reply to any media>`\n    Create a mirror picture. 🪞\n\n• `{i}flip <reply to any media>`\n    Flip it. ↕️\n\n• `{i}sketch <reply to any media>`\n    Draw a sketch of it. ✏️\n\n• `{i}blue <reply to any media>`\n    Just cool blue. ❄️\n\n• `{i}csample <color name /color code>`\n   Example: `{i}csample red`\n             `{i}csample #ffffff` 🎨\n\n• `{i}pixelator <reply image>`\n    Create a Pixelated Image. 👾\n"
help_instagram: " -\n\n• `{i}instadl <Instagram Url>`\n  `Download Instagram Media... ⬇️`\n\n• `{i}instadata <username>`\n  `Get Instagram Data of someone or yourself 📊`\n\n• `{i}instaul <reply video/photo> <caption>`\n  `Upload Media to Instagram... ⬆️`\n\n• `{i}igtv <reply video> <caption>`\n  `Upload Media to IGTV... 📺`\n\n• `{i}reels <reply video> <caption>`\n  `Upload Media to Instagram Reels... 🎬`\n\n• Go Inline with Your Assistant with the query `instatm`\n   To get home page posts... ✨\n\n• Fill in `INSTA_USERNAME` and `INSTA_PASSWORD`\n  before using it. 🔑\n"
help_locks: " -\n\n• `{i}lock <msgs/media/sticker/gif/games/inline/polls/invites/pin/changeinfo>`\n    Lock the specified setting in the used group. 🔒\n\n• `{i}unlock <msgs/media/sticker/gif/games/inline/polls/invites/pin/changeinfo>`\n    Unlock the specified setting in the used group. 🔓\n"
help_logo: " -\n\n• `{i}logo <text>`\n   Generate a logo of the given text. ✨\n   Or reply to an image to write your text on it.\n   Or reply to a Font File to write with that font. 🎨\n\n"
help_mediatools: " -\n\n• `{i}mediainfo <reply to media>`\n   Get info about it. ℹ️\n\n• `{i}rotate <degree/angle> <reply to media>`\n   Rotate any video/photo/media. 🔄\n   Note: For videos, it should be an angle in multiples of 90.\n"
help_misc: " -\n\n• `{i}eod`\n    `Get Events of the Day 🎊`\n\n• `{i}pntrst <link/id>`\n    Download and send Pinterest pins. 📌\n\n• `{i}gadget <search query>`\n    Gadget Search from Telegram. 📱\n\n• `{i}randomuser`\n   Generate details about a random user. 👤\n\n• `{i}ascii <reply image>`\n    Convert the replied image into HTML. 🌐\n"
help_mute: " -\n\n• `{i}mute <reply to msg/ user id>`\n    Mute a user in the current chat. 🔇\n\n• `{i}unmute <reply to msg/ user id>`\n    Unmute a user in the current chat. 🔊\n\n• `{i}dmute <reply to msg/ user id>`\n    Mute a user in the current chat by deleting their messages. 🗑️\n\n• `{i}undmute <reply to msg/ use id>`\n    Unmute a dmuted user in the current chat. 🔊\n\n• `{i}tmute <time> <reply to msg/ use id>`\n    s- seconds\n    m- minutes\n    h- hours\n    d- days\n    Mute a user in the current chat for a specific time. ⏳\n"
help_notes: " -\n\n• `{i}addnote <word><reply to a message>`\n    Add a note in the used chat with the replied message and chosen word. 📝\n\n• `{i}remnote <word>`\n    Remove the note from the used chat. 🗑️\n\n• `{i}listnote`\n    List all notes. 📋\n\n• Usage:\n   Set notes in a group so everyone can use them.\n   Type `#(Keyword of note)` to get it. ✨\n"
help_other: " -\n\n• `{i}send <username/id> <reply/type>`\n    Send a message to a User/Chat. 📩\n\n• `{i}fwdreply <reply to msg>`\n    Reply to someone's message by forwarding it in private. ⏩\n\n• `{i}save <reply message>`\n    Save that replied message to your Saved Messages box. 💾\n\n• `{i}fsave <reply message>`\n    Forward that replied message to your Saved Messages. ⏩\n"
help_pmpermit: " -\n\n• `{i}a` or `{i}approve`\n    Approve someone to PM. ✅\n\n• `{i}da` or `{i}disapprove`\n    Disapprove someone to PM. ❌\n\n• `{i}block`\n    Block someone. 🛑\n\n• `{i}unblock` | `{i}unblock all`\n    Unblock someone. 🔓\n\n• `{i}nologpm`\n    Stop logging messages from the user. 🚫\n\n• `{i}logpm`\n    Start logging messages from the user. 📝\n\n• `{i}startarchive`\n    Archive new PMs. 📦\n\n• `{i}stoparchive`\n    Don't archive new PMs. 🛑\n\n• `{i}cleararchive`\n    Unarchive all chats. 📂\n\n• `{i}listapproved`\n   List all approved PMs. 📋\n"
help_polls: " -\n\n• `{i}poll <question> ; <option> ; <option>`\n    Get an Anonymous Poll with the Given Options. 📊\n\n• `{i}poll <question> ; <option> ; <option> | <type>`\n    Get the poll specified with the desired type!\n    Type should be one of `public`, `multiple`, or `quiz`. 🎯\n\n• `{i}poll <question> ; <option> ; <option> | quiz_<answerno>`\n    Get a quiz poll where answerno is the number of the correct option. ✅\n\n"
help_profanityfilter: " -\n\n•`{i}addprofanity`\n   If someone sends a bad word in a chat, the bot will delete that message. 🤬🛡️\n\n•`{i}remprofanity`\n   Remove the chat from the Profanity list. 🔓\n\n"
help_profile: " -\n\n• `{i}setname <first name // last name>`\n    Change your profile name. 👤\n\n• `{i}setbio <bio>`\n    Change your profile bio. 📝\n\n• `{i}setpic <reply to pic>`\n    Change your profile picture. 🖼️\n\n• `{i}delpfp <n>(optional)`\n    Delete one profile picture if no value is given, else delete n number of pictures. 🗑️\n\n• `{i}poto <username>`\n    Upload the photo of the Chat/User if available. 📸\n"
help_qrcode: " -\n\n• `{i}qrcode <text/reply to text>`\n   `Makes a QR code of the text` 🔳\n\n• `{i}addqr <reply image> <text>`\n   `Makes a QR code of the text and adds it to the image.` 🖼️\n\n• `{i}qrdecode <reply to qrcode>`\n   `Decodes the QR code.` 🔍\n"
help_resize: " -\n\n•`{i}size <reply to media>`\n   Get the size of it. 📏\n\n•`{i}resize <number> <number>`\n   Resize the image on the x, y axis.\n   e.g., `{i}resize 690 960` 🖼️\n"
help_schedulemsg: " -\n\n•`{i}schedule <text/reply to msg> <time>`\n    For time, you can use seconds as a number, or like 1h or 1m.\n    e.g., `{i}schedule Hello 100` It delivers the message after 100 secs.\n    e.g., `{i}schedule Hello 1h` It delivers the message after an hour. ⏳\n"
help_search: " -\n\n• `{i}saavn <search query>`\n    Download songs from Saavn. 🎵\n\n• `{i}google <query>`\n    Perform a Google search. 🔍\n\n• `{i}github <username>`\n    Get full information about the user's GitHub profile. 💻\n\n• `{i}img <query>`\n  `{i}img <query> ; <no of results>`\n    Perform an Image search. 🖼️\n\n• `{i}reverse`\n    Reply to an Image or sticker to find its source. 🔄\n"
help_snips: " -\n\n• `{i}addsnip <word><reply to a message>`\n    Add the used word as a snip relating to the replied message. ✂️\n\n• `{i}remsnip <word>`\n    Remove the snip word. 🗑️\n\n• `{i}listsnip`\n    List all snips. 📋\n\n• Usage:\n    Type `$(your snip word)` to get the set reply. ✨\n"
help_specialtools: " -\n\n• `{i}wspr <username>`\n    Send a secret message... 🤫\n\n• `{i}q <color-optional>`\n• `{i}q @username`\n• `{i}q r <color-optional>`\n• `{i}q count` : `multiple quotes`\n    Create quotes... 💬\n\n• `{i}sticker <query>`\n    Search for Stickers as per your wish... 🖼️\n\n• `{i}getaudio <reply to an audio>`\n    Download Audio to put in your desired Video/Gif. 🎵\n\n• `{i}addaudio <reply to Video/gif>`\n    Put the above audio into the replied video/gif. 🎬\n\n• `{i}dob <date of birth>`\n    Put in dd/mm/yy format only (e.g., .dob 01/01/1999). 🎂\n\n• `{i}wall <query>`\n    Search for HD Wallpapers as per your wish... 🖼️\n"
help_stickertools: " -\n\n• `{i}destroy <reply to animated sticker>`\n    Destroy the sticker. 💥\n\n• `{i}tiny <reply to media>`\n    Create Tiny stickers. 🤏\n\n• `{i}kang <reply to image/sticker>`\n    Kang the sticker (add to your pack). 😎\n\n• `{i}packkang <pack name>`\n    Kang the complete sticker set (with a custom name). 📦\n\n• `{i}round <reply to any media>`\n    Extract a round sticker. ⭕\n"
help_sudo: " -\n\n• `{i}addsudo`\n    Add Sudo Users by replying to a user or using <space> separated userid(s). 👑\n\n• `{i}delsudo`\n    Remove Sudo Users by replying to a user or using <space> separated userid(s). 🗑️\n\n• `{i}listsudo`\n    List all sudo users. 📋\n"
help_tag: " -\n\n• `{i}tagall`\n    Tag the Top 100 Members of the chat. 📢\n\n• `{i}tagadmins`\n    Tag the Admins of that chat. 👑\n\n• `{i}tagowner`\n    Tag the Owner of that chat. 🌟\n\n• `{i}tagbots`\n    Tag the Bots of that chat. 🤖\n\n• `{i}tagrec`\n    Tag recently Active Members. 🟢\n\n• `{i}tagon`\n    Tag online Members (works only if privacy is off). 🌐\n\n• `{i}tagoff`\n    Tag offline Members (works only if privacy is off). 💤\n"
help_tools: " -\n\n• `{i}circle`\n    Reply to an audio song or gif to get a video note. ⭕\n\n• `{i}ls`\n    Get all the Files inside a Directory. 📂\n\n• `{i}bots`\n    Shows the number of bots in the current chat with their perma-link. 🤖\n\n• `{i}hl <a link> <text-optional>`\n    Embeds the link with a whitespace as a message. 🔗\n\n• `{i}id`\n    Reply to a Sticker to Get Its ID\n    Reply to a User to Get Their ID\n    Without Replying, You Will Get the Chat's ID 🆔\n\n• `{i}sg <reply to a user><username/id>`\n    Get the Name History of the replied user. 📜\n\n• `{i}tr <dest lang code> <(reply to) a message>`\n    Get a translated message. 🌍\n\n• `{i}webshot <url>`\n    Get a screenshot of the webpage. 📸\n\n• `{i}shorturl <url> <id-optional>`\n    Shorten any URL... 🔗\n"
help_unsplash: " -\n\n• {i}unsplash <search query> ; <no of pics>\n    Unsplash Image Search. 🖼️\n"
help_usage: "\n\n• `{i}usage`\n    Get overall usage. 📊\n\n• `{i}usage heroku`\n   Get Heroku stats. ⚙️\n\n• `{i}usage db`\n   Get database storage usage. 💾\n"
help_utilities: " -\n\n• `{i}kickme` : Leaves the group. 👋\n\n• `{i}date` : Show the Calendar. 📅\n\n• `{i}listreserved`\n    List all usernames (channels/groups) you own. 📋\n\n• `{i}stats` : See your profile stats. 📊\n\n• `{i}paste` - `Include long text / Reply to a text file.` 📋\n\n• `{i}info <username/userid/chatid>`\n    Reply to someone's message. ℹ️\n\n• `{i}invite <username/userid>`\n    Add a user to the chat. ➕\n\n• `{i}rmbg <reply to pic>`\n    Remove the background from that picture. 🖼️\n\n• `{i}telegraph <reply to media/text>`\n    Upload media/text to Telegraph. 🌐\n\n• `{i}json <reply to msg>`\n    Get the JSON encoding of the message. 💻\n\n• `{i}suggest <reply to message> or <poll title>`\n    Create a Yes/No poll for the replied suggestion. 📊\n\n• `{i}ipinfo <ipAddress>` : Get info about that IP address. 🌐\n\n• `{i}cpy <reply to message>`\n   Copy the replied message, with formatting. Expires in 24hrs. 📋\n• `{i}pst`\n   Paste the copied message, with formatting. 📝\n\n• `{i}thumb <reply file>` : Download the thumbnail of the replied file. 🖼️\n\n• `{i}getmsg <message link>`\n  Get messages from chats with forward/copy restrictions. 🔓\n"
help_variables: " -\n\n• `{i}get var <variable name>`\n   Get the value of the given variable name. ⚙️\n\n• `{i}get type <variable name>`\n   Get the variable type. ℹ️\n\n• `{i}get db <key>`\n   Get the DB value of the given key. 💾\n\n• `{i}get keys`\n   Get all Redis keys. 🔑\n"
help_vctools: " -\n\n• `{i}startvc`\n    Start a Group Call in a group. 🎙️\n\n• `{i}stopvc`\n    Stop a Group Call in a group. 🛑\n\n• `{i}vctitle <title>`\n    Change the title of the Group Call. ✏️\n\n• `{i}vcinvite`\n    Invite all members of the group to the Group Call.\n    (You must be joined) 👥\n"
help_videotools: " -\n\n•`{i}sample <duration in seconds>`\n   Creates a short sample of the video... 🎬\n\n• `{i}vshots <number of shots>`\n   Creates screenshots of the video... 📸\n\n• `{i}vtrim <start time> - <end time> in seconds`\n    Crop a lengthy video... ✂️\n"
help_warn: "\n\n•`{i}warn <reply to user> <reason>`\n    Gives a Warning. ⚠️\n\n•`{i}resetwarn <reply to user>`\n    Reset All Warnings. 🔄\n\n•`{i}warns <reply to user>`\n   Get the List of Warnings for a user. 📋\n\n•`{i}setwarn <warn count> | <ban/mute/kick>`\n   Set a number for the warn count for warnings.\n   After putting a ' | ' mark, put an action like ban/mute/kick.\n   Its default is 3 kicks.\n   Example: `setwarn 5 | mute` ⚙️\n\n"
help_webupload: " -\n\n• `{i}webupload`\n    Upload files to another server. ☁️\n"
help_words: " -\n\n• `{i}meaning <word>`\n    Get the meaning of the word. 📖\n\n• `{i}synonym <word>`\n    Get all synonyms. 🔄\n\n• `{i}antonym <word>`\n    Get all antonyms. ↔️\n\n• `{i}ud <word>`\n    Fetch the word definition from Urban Dictionary. 📚\n"
help_ziptools: "\n\n• `{i}zip <reply to file>`\n    Zip the replied file.\n    To set a password on the zip: `{i}zip <password>` reply to file. 🗜️\n\n• `{i}unzip <reply to zip file>`\n    Unzip the replied file. 📂\n\n• `{i}azip <reply to file>`\n   Add a file to the batch for batch upload zip. ➕\n\n• `{i}dozip`\n   Upload batch zip the files you added from `{i}azip`.\n   To set a Password: `{i}dozip <password>` 🗂️\n\n"
